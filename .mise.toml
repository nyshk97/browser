# ランタイムはグローバル設定（~/.config/mise/config.toml）の node に任せる。
# 固定が必要になったらここに [tools] を足す。

[tasks.setup]
description = "依存と拡張 artifact を揃える（初回・clone 直後に実行する）"
run = """
pnpm install --frozen-lockfile
node scripts/ext-fetch.mjs
node scripts/ext-verify.mjs
"""

[tasks.dev]
description = "開発版 Nemo を起動する（HMR あり・拡張つき・remote debugging 9333）"
run = "node scripts/dev.mjs"

[tasks."dev:nodebug"]
description = "remote debugging を開けずに開発版 Nemo を起動する（実 Vault の Bitwarden を入れて触るとき）"
run = "node scripts/dev.mjs --no-debug"

[tasks."dev:popup"]
description = "拡張 popup の DevTools を自動で開いて起動する（popup の不具合を追うとき。CDP は開かない）"
run = "node scripts/dev.mjs --no-debug --popup-devtools"

[tasks."dev:build"]
description = "ビルドしてから開発版 Nemo を起動する（HMR なし・本番に近い経路で確認する）"
run = "node scripts/dev.mjs --built"

[tasks.build]
description = "本番ビルドを作る（out/ に出力）"
run = "pnpm exec electron-vite build"

[tasks.typecheck]
description = "TypeScript の型検査を行う"
run = """
pnpm exec tsc --noEmit -p tsconfig.node.json
pnpm exec tsc --noEmit -p tsconfig.web.json
"""

[tasks."test:pages"]
description = "受け入れテスト用のページサーバを起動する（http://127.0.0.1:8787/）"
run = "node scripts/test-server.mjs"

[tasks.lint]
description = "eslint と prettier で静的チェックする"
run = '''
pnpm exec eslint .
pnpm exec prettier --check .
'''

[tasks.format]
description = "prettier で整形する"
run = "pnpm exec prettier --write ."

[tasks.test]
description = "ユニットテストを回す（Electron 不要・CI の必須チェック）"
run = "node --test scripts/*.test.mjs"

[tasks.check]
description = "コミット前の一括チェック（lint → typecheck → ユニットテスト）"
depends = ["lint", "typecheck", "test"]

[tasks.verify]
description = "自走検証を通す（ユニットテスト→ビルド→アプリ起動→CDP で検証→後片付け）"
run = "node scripts/verify-all.mjs"

[tasks."verify:only"]
description = "自走検証のうち指定したものだけ回す（例: mise run verify:only phase1 pins）"
usage = 'arg "<targets>" var=#true help="spike / phase1 / phase2 / pins / switcher / peek / split / call / live-folder / http-auth / vim-scroll / restart / migration / db / slots / auth-vault / metrics"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# 可変長引数は `$usage_<arg名>` に**1つの文字列**で入る（要素ごとにクォートが付くことがある）。
# eval で位置パラメータに開き直してから渡す。
eval "set -- ${usage_targets:-}"
node scripts/verify-all.mjs --only "$@"
'''

[tasks."verify:changed"]
description = "作業ツリーの変更から回す検証を自動で選んで回す（無関係な変更だけなら何も回さない）"
run = "node scripts/verify-all.mjs --changed"

[tasks."verify:migration"]
description = "旧版（セッション v2 / pins v1）のデータから起動して移行が壊れていないか確かめる"
run = "node scripts/verify-session-migration.mjs"

[tasks."verify:db-migration"]
description = "旧スキーマの履歴 DB から起動して favicon_url 列の追加が壊れていないか確かめる"
run = "node scripts/verify-db-migration.mjs"

[tasks."verify:split"]
description = "分割ビュー（2 ペイン）だけを検証する（アプリの起動ごと面倒を見る）"
run = "node scripts/verify-all.mjs --only split"

[tasks."verify:switcher"]
description = "タブスイッチャー（⌃M）だけを検証する（Nemo を起動してから回す）"
run = "node scripts/verify-switcher.mjs"

[tasks."verify:ext"]
description = "拡張互換の smoke test（自作テスト拡張・資格情報なし・CI の必須チェック）"
run = "node scripts/verify-ext-smoke.mjs"

[tasks."verify:ext-idle"]
description = "拡張互換の smoke test に service worker の idle 停止をまたぐ確認を足す（遅い）"
run = "node scripts/verify-ext-smoke.mjs --sw-idle"

[tasks."verify:packaged"]
description = "パッケージした .app を起動して smoke test する（SQLite・拡張・ログ）"
usage = 'arg "<channel>" default="dev" help="dev または stable"'
run = 'node scripts/verify-packaged.mjs "$usage_channel"'

[tasks.package]
description = "dev 版をパッケージして成果物を検査する（.app + dmg）"
run = "node scripts/package.mjs dev"

[tasks."package:stable"]
description = "常用版をパッケージして成果物を検査する（.app + dmg）"
run = "node scripts/package.mjs stable"

[tasks.release]
description = "常用版をリリースする（ビルド→署名→notarize→GitHub Release→タグ。1コマンドで完結する唯一の経路）"
usage = 'arg "<version>" default="patch" help="patch / minor / major / x.y.z"'
run = 'node scripts/release.mjs "$usage_version"'

[tasks."metrics:report"]
description = "診断ログのメモリ・CPU（metrics.sample）を日別 × チャンネル別に集計して出す"
run = "node scripts/metrics-report.mjs"

[tasks.licenses]
description = "依存ライブラリのライセンスを棚卸しする（GPL-3.0 と衝突しないことの確認）"
run = "node scripts/license-report.mjs --check"

[tasks.icons]
description = "アプリアイコン（常用版 / dev 版）を生成する"
run = "node scripts/make-icons.mjs"

[tasks."ext:test-build"]
description = "CI 用テスト拡張を materialize して lock を書き出す（出力先を指定する）"
usage = 'arg "<outdir>" help="出力先ディレクトリ"'
run = 'node scripts/make-test-extension.mjs "$usage_outdir"'

[tasks."verify:ext-update"]
description = "拡張の版を上げ下げしても拡張の設定（chrome.storage）が失われないことを実物で検証する"
usage = 'arg "<version>" default="2026.7.0" help="一時的に張り替える先のバージョン"'
run = 'node scripts/verify-ext-update.mjs "$usage_version"'

[tasks."ext:fetch"]
description = "extensions.lock.json に従って拡張 artifact を取得・展開する"
run = "node scripts/ext-fetch.mjs"

[tasks."ext:verify"]
description = "展開済み拡張が lock と一致しているか検証する（ツリー hash まで見る）"
run = "node scripts/ext-verify.mjs"

[tasks."ext:update"]
description = "拡張を指定バージョンへ張り替えて lock を更新する（--id で対象を絞る。省略時は全拡張）"
usage = '''
arg "<version>" help="張り替え先のバージョン（例: 2026.8.0）"
flag "--id <id>" help="対象の拡張 ID（lock に複数あるときは必須級。省略すると全拡張に同じ版を当てる）"
'''
run = '''
if [ -n "$usage_id" ]; then
  node scripts/ext-fetch.mjs --update "$usage_version" --id "$usage_id"
else
  node scripts/ext-fetch.mjs --update "$usage_version"
fi
'''

[tasks."ext:rollback"]
description = "extensions.lock.json を git の状態に戻して拡張を再展開する（キャッシュから復元）"
run = """
if ! git checkout -- extensions.lock.json 2>/dev/null; then
  echo "extensions.lock.json を git から復元できない（未コミットのリポジトリなど）。"
  echo "戻したいバージョンが分かっているなら次で戻せる:"
  echo "  mise run ext:update <version>"
  exit 1
fi
node scripts/ext-fetch.mjs
"""

[tasks."arc:import"]
description = "Arc のサイドバー（Favorites・ピン留め・フォルダ）を Nemo に取り込む（冪等）"
usage = '''
arg "<channel>" default="stable" help="stable または dev"
flag "--dry-run" help="書き込まずに取り込む内容だけ表示する"
flag "--replace" help="既存のピン留めを捨てて Arc の内容で置き換える"
'''
run = '''
extra=""
[ "$usage_dry_run" = "true" ] && extra="$extra --dry-run"
[ "$usage_replace" = "true" ] && extra="$extra --replace"
node scripts/arc-import.mjs --channel "$usage_channel" $extra
'''

[tasks."ext:outdated"]
description = "拡張に新しいバージョンが出ていないか確認する（何も書き換えない）"
run = "node scripts/ext-outdated.mjs"
