<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>お問い合わせ | 自動入力の検証（姓名が 2 枠に分かれる形）</title>
  </head>
  <body>
    <!--
      実在する問い合わせフォームと同じ組み方: th の label の for が指す欄は無く（contact_name は実在しない）、
      td に「姓」「名」の 2 枠が並ぶ。Jev は 1 枠目の例「姓」に引っ張られて family_name と答える
      （2026-09-27 に実 Jev で family_name 0.53 / full_name 0.47）。2 枠の組では姓・名・一括を同じ答えとみなす
    -->
    <form>
      <table>
        <tr>
          <th>
            <h4><label for="contact_name">氏名</label><span>必須</span></h4>
          </th>
          <td>
            <input placeholder="姓" type="text" name="last_name" /><input placeholder="名" type="text" name="first_name" />
          </td>
        </tr>
        <tr>
          <th>
            <h4><label for="contact_name_kana">ふりがな</label><span>必須</span></h4>
          </th>
          <td>
            <input placeholder="せい" type="text" name="last_name_kana" /><input
              placeholder="めい"
              type="text"
              name="first_name_kana"
            />
          </td>
        </tr>
        <tr>
          <th>
            <h4><label for="contact_tel">電話番号</label><span>必須</span></h4>
          </th>
          <td><input placeholder="090XXXXXXXX" type="text" name="tel" id="contact_tel" /></td>
        </tr>
      </table>
    </form>
  </body>
</html>
