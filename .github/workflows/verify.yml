name: 自走検証（Electron・依存の更新）

# 依存（Electron を含む）や拡張の lock が変わる PR で、本体の自走検証（verify-all）を回す。
# ci.yml が回すのは lint・ユニットテスト・拡張の smoke・パッケージだけなので、
# Electron の更新で本体の挙動が壊れていないかはここで見る。
#
# 拡張は verify-all が自作テスト拡張を作って読み込ませるので、外からのダウンロードは無い
# （以前は実物の Bitwarden を取ってきていたが、外した。2026-09-28）。
#
# 手動実行と、依存・lock の更新 PR のときだけ回す（macOS で数分かかるため）。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'extensions.lock.json'

jobs:
  verify:
    name: 自走検証（verify-all）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 自走検証（テスト拡張 + ブラウザ本体）
        run: |
          set -o pipefail
          node scripts/verify-all.mjs 2>&1 | tee "$RUNNER_TEMP/verify.log"
      - name: 落ちた検査（ログが長く、FAIL の行が先頭側に埋もれるので末尾にまとめる）
        if: failure()
        run: |
          grep -E '^\s*(FAIL|KNOWN)\s|^\[verify\]' "$RUNNER_TEMP/verify.log" || echo "(FAIL の行なし)"
          # FAIL を出す前に例外で止まったスイート（終了コードだけが 0 以外）の手がかり
          echo "----- 例外（Error: の行と直後のスタック）"
          grep -E -A4 '^(Uncaught |node:internal|\S*Error: |Error: )' "$RUNNER_TEMP/verify.log" | grep -v '^\[nemo\]' | head -60 || true
