# パッケージング設定。
#
# dev 版 / 常用版は **appId・productName・データディレクトリを分ける**。
# ビルド種別は `NEMO_BUILD_CHANNEL` で切り替える（既定は dev）。
# `mise run package` / `mise run package:stable` から呼ばれる。

# appId / productName / icon は channel ごとに変わるので、
# `scripts/package.mjs` が `--config.<key>` で渡す。
# （`${env.X}` の展開はここでは効かない keys がある）
copyright: Copyright (C) 2026 nyshk97

# 自動更新の feed（`publish`）は **ここには書かない**。
#
# ここに書くと dev 版の成果物にも `app-update.yml` が埋め込まれ、
# dev で更新チェックが走った瞬間に常用版のビルドで dev が置き換わる。
# `--config.publish=null` での打ち消しは効かない（"null" という名前の
# publisher を探しに行って落ちる）ので、**stable のときだけ
# `scripts/package.mjs` が `--config.publish.*` で足す**。
#
# アップロード自体は `scripts/release.mjs` が `gh` で行うので、
# electron-builder には常に `--publish never` を渡す。

# dev 版から更新 feed を外す（署名より前・dmg を作る前）。
afterPack: scripts/after-pack.mjs

# 署名の直後・dmg / zip を作る前に .app を notarize + staple する。
# `NEMO_NOTARIZE=1` のときだけ動く（既定は何もしない）。
afterSign: scripts/notarize.mjs

# dmg ができた後に dmg 自体も notarize + staple する。
# .app だけ公証しても、dmg には署名もチケットも無いままで警告が出る。
afterAllArtifactBuild: scripts/notarize-dmg.mjs

directories:
  buildResources: build

files:
  - out/**/*
  - package.json
  # electron-chrome-extensions の preload は bundler が拾わないので明示的に入れる
  - node_modules/electron-chrome-extensions/dist/**/*

# lock された拡張 artifact は **asar の外**（Contents/Resources/）に置く。
# Chromium の拡張ローダーはネイティブコードなので、asar の中のパスからは読めない。
extraResources:
  - from: extensions
    to: extensions
  - from: extensions.lock.json
    to: extensions.lock.json
  # GPL-3.0 で配る以上、第三者ソフトウェアの notice は成果物に同梱する
  - from: build/THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE

asarUnpack:
  # ネイティブモジュールは asar の中からはロードできない
  - '**/*.node'
  - node_modules/better-sqlite3/**/*
  # preload は実ファイルパスで渡す必要がある
  - node_modules/electron-chrome-extensions/dist/**/*

dmg:
  # electron-builder の既定は dmg を署名しない。公証の前に署名しておく。
  sign: true

mac:
  category: public.app-category.productivity
  # dmg は人が入れるため、zip は electron-updater が差分更新に使うため
  # （macOS の自動更新は zip でしか適用できない）。dev 版は dmg だけに絞る。
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  darkModeSupport: true
  # 任意のサイトを開くアプリなので hardened runtime は必須
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Electron fuses。ここを緩めると、署名済みアプリが任意の Node スクリプトを
# 実行する踏み台になる。`scripts/check-fuses.mjs` が成果物を検査する。
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
